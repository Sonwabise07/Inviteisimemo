<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px;}
    .card{background:#fff;max-width:520px;margin:0 auto;border-radius:8px;overflow:hidden;}
    .header{background:#0a0a0a;color:#e8d5a3;padding:28px 32px;text-align:center;}
    .header h1{font-size:18px;font-weight:300;margin:0 0 4px;}
    .header p{font-size:12px;color:#666;margin:0;}
    .body{padding:28px 32px;}
    .message{font-size:15px;color:#333;line-height:1.7;white-space:pre-wrap;}
    .footer{background:#f9f9f9;padding:16px 32px;text-align:center;font-size:12px;color:#aaa;}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Update from {{ event.host_name }}</h1>
    <p>{{ event.event_title }} · {{ event.event_date }}</p>
  </div>
  <div class="body">
    <div class="message">{{ message }}</div>
  </div>
  <div class="footer">Invitely · {{ event.event_title }}</div>
</div>
</body>
</html>
