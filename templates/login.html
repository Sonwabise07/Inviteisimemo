<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In — Invitely</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <style>
    .auth-wrap { max-width: 420px; margin: 0 auto; padding: 3rem 1.5rem; }
    .auth-logo { font-family: Georgia, serif; font-size: 1.5rem; color: #e8d5a3; letter-spacing: .05em; text-align: center; margin-bottom: 2.5rem; display: block; text-decoration: none; }
    .auth-title { font-family: Georgia, serif; font-size: 1.9rem; color: #fff; text-align: center; margin-bottom: .4rem; }
    .auth-sub { color: #666; font-size: .88rem; text-align: center; margin-bottom: 2rem; }
    .auth-card { background: #111; border: 1px solid rgba(232,213,163,0.1); border-radius: 14px; padding: 2rem; }
    .auth-field { margin-bottom: 1.2rem; }
    .auth-field label { display: block; font-size: .78rem; font-weight: 500; color: #999; letter-spacing: .05em; text-transform: uppercase; margin-bottom: .45rem; }
    .auth-field input { width: 100%; background: #080808; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: .75rem 1rem; color: #e0e0e0; font-size: .9rem; outline: none; transition: border-color .2s; }
    .auth-field input:focus { border-color: rgba(232,213,163,0.4); }
    .auth-check { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.4rem; }
    .auth-check input { width: auto; }
    .auth-check label { font-size: .82rem; color: #888; text-transform: none; letter-spacing: 0; margin: 0; }
    .auth-btn { width: 100%; background: #e8d5a3; color: #080808; border: none; border-radius: 8px; padding: .85rem; font-size: .9rem; font-weight: 600; cursor: pointer; transition: background .2s; }
    .auth-btn:hover { background: #d4be88; }
    .auth-divider { text-align: center; margin: 1.5rem 0; color: #444; font-size: .8rem; }
    .auth-link { display: block; text-align: center; color: #e8d5a3; font-size: .84rem; text-decoration: none; }
    .auth-link:hover { text-decoration: underline; }
    .flash-msg { border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem; font-size: .84rem; }
    .flash-msg.error { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
    .flash-msg.success { background: rgba(29,158,117,0.12); color: #1d9e75; border: 1px solid rgba(29,158,117,0.2); }
  </style>
</head>
<body style="background:#080808; min-height:100vh;">
<div class="auth-wrap">
  <a class="auth-logo" href="{{ url_for('index') }}">Invitely</a>
  <div class="auth-title">Welcome back</div>
  <div class="auth-sub">Sign in to manage your events</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash-msg {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="auth-card">
    <form method="POST" action="{{ url_for('login') }}{% if next %}?next={{ next }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="auth-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}"
               placeholder="you@example.com" required autocomplete="email"/>
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password"/>
      </div>

      <div class="auth-check">
        <input type="checkbox" id="remember" name="remember"/>
        <label for="remember">Keep me signed in for 14 days</label>
      </div>

      <button type="submit" class="auth-btn">Sign in →</button>
      <div style="text-align:right;margin-top:.7rem;">
        <a href="{{ url_for('forgot_password') }}" style="font-size:.75rem;color:#555;text-decoration:none;">Forgot password?</a>
      </div>
    </form>

    <div class="auth-divider">— or —</div>
    <a class="auth-link" href="{{ url_for('register') }}">Create a free Invitely account</a>
  </div>
</div>
</body>
</html>
